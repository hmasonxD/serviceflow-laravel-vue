name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    quality:
        name: Quality, Tests and Build
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: serviceflow_test
                    MYSQL_USER: serviceflow
                    MYSQL_PASSWORD: serviceflow_test_password
                    MYSQL_ROOT_PASSWORD: root_password
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        env:
            APP_ENV: testing
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: serviceflow_test
            DB_USERNAME: serviceflow
            DB_PASSWORD: serviceflow_test_password
            MAIL_MAILER: array
            CACHE_STORE: array
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  extensions: mbstring, pdo_mysql
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "26"
                  cache: npm

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Install frontend dependencies
              run: npm ci

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run migrations
              run: php artisan migrate --force

            - name: Run project checks
              run: composer run ci:check

            - name: Build production assets
              run: npm run build
